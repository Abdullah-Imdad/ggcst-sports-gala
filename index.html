<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GGCST SPORTS GALA</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b6b3a"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f7f5;--c:#fff;--t:#14281d;--m:#5b6b62;--p:#0b6b3a;--a:#c9a227;--b:#dde5e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1a14;--c:#17251d;--t:#e8f1ec;--m:#9db0a5;--p:#3fb877;--b:#26382d}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(135deg,#0b6b3a,#084d2a);color:#fff;text-align:center;padding:18px 12px}header img{height:72px;border-radius:12px;background:#fff;padding:2px}
header h1{margin:6px 0 0;font-size:15px;letter-spacing:.5px}header h2{margin:2px 0 0;font-size:22px;color:#f1d46a}
nav{display:flex;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{flex:1;min-width:0;font-size:12px;padding:12px 2px;border:0;background:none;color:var(--m);font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--p);border-color:var(--p)}main{max-width:900px;margin:auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
label{font-size:13px;color:var(--m);font-weight:600}.btn{background:var(--p);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer;margin:2px}
.btn.o{background:none;color:var(--p);border:1px solid var(--p)}.btn.r{background:#b3261e}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}.chk input{width:auto;margin:0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--b);padding:6px;text-align:left;white-space:nowrap}th{background:var(--bg)}
.st{display:flex;gap:8px;flex-wrap:wrap}.st div{flex:1;min-width:90px;text-align:center;background:var(--bg);border-radius:10px;padding:10px}.st b{display:block;font-size:22px;color:var(--p)}
.pr{display:flex;gap:12px;align-items:center}.pr img{width:90px;height:110px;object-fit:cover;border-radius:10px;border:2px solid var(--a);background:var(--b)}
.tag{display:inline-block;background:var(--b);border-radius:20px;padding:2px 9px;font-size:12px;margin:2px}.note{font-size:12px;color:var(--m)}
#qr{width:150px;height:150px;margin:auto}#qr img{margin:auto}
@media print{header,nav,.np{display:none!important}body{background:#fff;color:#000}}

let S={...DEF},R=[],db=null,tab="home",role=null,sub="rec",flt={t:"",g:"",w:""},T={};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sports=()=>S.sports.split("\n").filter(x=>x.trim()).map(l=>{const p=l.split("|");return{n:p[0],m:p[1]!="0",f:p[2]=="1",t:p[3]=="1"}});
const saveS=()=>FB.setDoc(FB.doc(FB.db,"app","settings"),JSON.parse(JSON.stringify(S))).catch(e=>alert("Save failed: "+e.message));
let ST={},unR=null;
const soft=()=>{if(tab!="reg"&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||""))draw()};
function start(){const{db,doc,collection,onSnapshot,onAuthStateChanged}=FB,low=a=>a.map(x=>x.toLowerCase());
 onSnapshot(doc(db,"app","settings"),s=>{if(s.exists()){S={...DEF,...s.data()};soft()}},()=>{});
 onSnapshot(doc(db,"stats","c"),s=>{ST=s.exists()?s.data():{};soft()},()=>{});
 onAuthStateChanged(FB.auth,u=>{if(unR){unR();unR=null}R=[];const e=((u&&u.email)||"").toLowerCase();
  role=low(CFG.dev).includes(e)?"dev":low(CFG.admins).includes(e)?"admin":null;
  if(u&&!role){FB.logout();alert("Not allowed. Login email: "+e+" | App list: "+CFG.dev.concat(CFG.admins).join(", "))}
  if(role)unR=onSnapshot(collection(db,"regs"),s=>{R=s.docs.map(d=>({id:d.id,...d.data()}));soft()},()=>{});draw()})}
async function saveR(r){const{db,doc,runTransaction,increment}=FB;let w="";
 await runTransaction(db,async tx=>{const sr=doc(db,"stats","c"),s=await tx.get(sr),d=s.exists()?s.data():{};
  if(r.type!="Teacher"){w=r.gender=="Female"?"Fatima":WINGS.slice(0,4).map(x=>[x,d["w_"+x]||0]).sort((a,b)=>a[1]-b[1])[0][0];r.wing=w}
  tx.set(doc(db,"regs",r.id),r);const u={total:increment(1)};u[r.type=="Teacher"?"teacher":r.gender.toLowerCase()]=increment(1);if(w)u["w_"+w]=increment(1);tx.set(sr,u,{merge:true})});return w}
async function delR(id){const r=R.find(x=>x.id==id);if(!r)return;const{db,doc,writeBatch,increment}=FB,b=writeBatch(db),u={total:increment(-1)};u[r.type=="Teacher"?"teacher":r.gender.toLowerCase()]=increment(-1);if(r.wing)u["w_"+r.wing]=increment(-1);b.delete(doc(db,"regs",id));b.set(doc(db,"stats","c"),u,{merge:true});await b.commit()}
function recount(){const u={total:R.length,male:0,female:0,teacher:0};WINGS.forEach(w=>u["w_"+w]=0);R.forEach(r=>{u[r.type=="Teacher"?"teacher":r.gender.toLowerCase()]++;if(r.wing)u["w_"+r.wing]++});FB.setDoc(FB.doc(FB.db,"stats","c"),u).then(()=>alert("Counts updated"))}
